apiVersion: v1
kind: PersistentVolume
metadata:
  name: my-local-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: "/tmp/data"
  
  #If we have already a ebs create and we can mount by below or if not use storage class to create the ebs dynamically.
  #awsElasticBlockStore:
    #volumeID: "vol-xx"
    #fstype: ext4
